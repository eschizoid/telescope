name: Release

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: "Release Type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # axion-release derives the version from the git history; needs full depth.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Set Git Identity
        run: |
          git config --global user.email "mariano.gonzalez.mx@gmail.com"
          git config --global user.name "Mariano Gonzalez"

      # actions/checkout v5+ stores GITHUB_TOKEN in `git config http.extraheader`
      # instead of embedding it in the origin URL. Native `git` honors extraheader;
      # the jgit version pinned via `force(libs.jgit)` in build.gradle.kts does not.
      # Axion-release pushes the release tag through jgit, so it falls back to
      # anonymous and GitHub rejects the push as "not authorized". Embedding the
      # token directly in the remote URL restores the v4-era behavior for the
      # jgit-driven push without bumping the release-toolchain trio.
      - name: Configure git remote auth for jgit
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Setup GPG
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Update Version and Create Tag
        id: version
        run: |
          # axion-release bumps the version per the chosen incrementer, creates the v* tag,
          # commits the SNAPSHOT bump-back, and pushes both. -Prelease.disableChecks skips the
          # uncommitted-changes guard so the release commit itself isn't rejected.
          ./gradlew release -Prelease.incrementer=${{ inputs.releaseType }} -Prelease.disableChecks -x test

          RAW_VERSION=$(./gradlew currentVersion -q -Prelease.quiet)
          TAG_VERSION="v$RAW_VERSION"
          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tagName=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $RAW_VERSION (tag $TAG_VERSION)"

      - name: Sync README install snippets to the released version
        run: |
          # The README pins the release version in its install snippets; rewrite every
          # io.github.eschizoid:telescope-* coordinate and the Maven <version> block to the
          # version just tagged, so the docs never trail the release.
          VERSION="${{ steps.version.outputs.version }}"
          for f in README.md docs/codegen.md; do
            sed -i -E "s/(io\.github\.eschizoid:telescope-[a-z-]+:)[0-9]+\.[0-9]+\.[0-9]+/\1${VERSION}/g" "$f"
            # XML <version> blocks: only the one directly following a telescope artifactId —
            # a blanket replace would clobber unrelated pins (the Lombok processor path).
            awk -v v="$VERSION" '
              /<artifactId>telescope-/ { tele = 1; print; next }
              tele && /<version>[0-9]+\.[0-9]+\.[0-9]+<\/version>/ {
                sub(/<version>[0-9]+\.[0-9]+\.[0-9]+<\/version>/, "<version>" v "</version>")
                tele = 0; print; next
              }
              { tele = 0; print }
            ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          if ! git diff --quiet README.md docs/codegen.md; then
            git add README.md docs/codegen.md
            git commit -m "docs: bump README install snippets to ${VERSION}"
            git push
          fi

      - name: Build and publish artifacts
        # Single root `publish` task fans out to every subproject that applies maven-publish.
        # Matches the JReleaser stagingRepository discovery in build.gradle.kts — when a new
        # module wires up maven-publish, both the staging slot AND this publish step pick it
        # up automatically. No more "forgot to add :foo:publish" release failures.
        run: ./gradlew clean build publish -x test
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Publish to Maven Central
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        # JReleaser 1.19.0 calls Task.project at execution time, which is forbidden under
        # Gradle's configuration cache (the project has `org.gradle.configuration-cache=true`
        # in gradle.properties with `problems=fail`). Bypass config-cache just for this task —
        # the rest of the build still benefits from it.
        run: ./gradlew jreleaserFullRelease --stacktrace --no-configuration-cache
