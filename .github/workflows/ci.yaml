name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Local links resolve
        run: |
          # Every relative markdown link in README.md and docs/ must point at a real file.
          fail=0
          for f in README.md docs/*.md; do
            dir=$(dirname "$f")
            grep -oE '\]\(([^)#http][^)#]*)' "$f" | sed 's/](//' | while read -r target; do
              [ -e "$dir/$target" ] || { echo "BROKEN: $f -> $target"; exit 1; }
            done || fail=1
          done
          exit $fail
      - name: Install snippets match the latest release
        run: |
          # The README's telescope coordinates must pin the latest RELEASE version. Select the
          # highest semver tag explicitly — `git describe` returns the closest reachable tag, which
          # picks up rolling markers like `early-access` that are not releases at all. Strip only a
          # leading "v" (`tr -d v` would eat any "v" in the string).
          VERSION=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')
          if [ -z "$VERSION" ]; then
            echo "No release tag yet — nothing to check."; exit 0
          fi
          if ! grep -q "io.github.eschizoid:telescope-core:${VERSION}" README.md; then
            echo "README install snippet does not pin ${VERSION} (latest release tag)"; exit 1
          fi
          echo "README pins ${VERSION}"

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew check --no-daemon --stacktrace

      - name: Verify javadoc (cross-module link integrity)
        run: |
          ./gradlew --no-daemon --stacktrace --rerun-tasks \
            :internal:javadoc \
            :core:javadoc \
            :codegen:javadoc \
            :lombok:javadoc \
            :quarkus:javadoc \
            :spring-boot-starter:javadoc

      - name: Jacoco
        run: |
          ./gradlew :internal:jacocoTestReport \
            :core:jacocoTestReport \
            :codegen:jacocoTestReport \
            :lombok:jacocoTestReport \
            :spring-boot-starter:jacocoTestReport \
            :quarkus:jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: eschizoid/telescope
          files: |
            ./internal/build/reports/jacoco/test/jacocoTestReport.xml
            ./core/build/reports/jacoco/test/jacocoTestReport.xml
            ./codegen/build/reports/jacoco/test/jacocoTestReport.xml
            ./lombok/build/reports/jacoco/test/jacocoTestReport.xml
            ./spring-boot-starter/build/reports/jacoco/test/jacocoTestReport.xml
            ./quarkus/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: eschizoid/telescope
          files: |
            ./**/build/test-results/test/*.xml

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: "**/build/reports/tests/"
          retention-days: 7
