# The two providers this module registers are held by telescope-core classes initialized at build
# time, so they are initialized at build time too, and the proxy accessors they bind land in the
# image heap as MethodHandle closures. The Jakarta Persistence utility is the exception: it is the
# provider's own object, so it is created when the image first asks whether a container is loaded.
Args = --initialize-at-build-time=io.github.eschizoid.telescope.jpa \
       --initialize-at-run-time=io.github.eschizoid.telescope.jpa.LoadStates$Api
