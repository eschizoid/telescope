demo.seller.name=Telescope Goods Ltd
demo.seller.vat-id=GB123456789

# Inside this build telescope-core and telescope-internal are local projects, which Quarkus loads with
# the application's own classes, while it loads the telescope extension with the other dependencies.
# Loading them parent first gives both one copy, as a published telescope-core jar would.
quarkus.class-loading.parent-first-artifacts=io.github.eschizoid:core,io.github.eschizoid:internal

# The shared domain module carries no Jandex index. Indexing it lets the build walk the DTOs the
# API writes, down to the records they hold, when it registers them for reflection in a native image.
quarkus.index-dependency.domain.group-id=io.github.eschizoid
quarkus.index-dependency.domain.artifact-id=domain
