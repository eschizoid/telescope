spring:
  datasource:
    url: jdbc:h2:mem:product-demo
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: true
        format_sql: true
    open-in-view: false

# TelescopeAutoConfiguration's own knobs — both defaults are fine for this demo. Listed here so
# the IDE picks up the configuration-metadata.json and offers completion.
telescope:
  registry:
    fail-fast: true
