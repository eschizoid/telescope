spring.application.name=telescope-org-chart-demo

# JPA settings — H2 in-memory schema is recreated on startup so the demo is self-contained.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Open-in-view OFF — same hygiene as production. The /org-chart endpoints rely on the
# @Transactional boundary inside the controller, so lazy loads outside that boundary fail loudly.
spring.jpa.open-in-view=false
